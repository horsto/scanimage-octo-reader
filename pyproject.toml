[build-system]
requires = ['setuptools>=64', 'setuptools_scm>=8']
build-backend = 'setuptools.build_meta'

[project]
name = 'scanimage-octo-reader'
description = 'Inspect ScanImage TIFF timeseries: structured metadata, AUX trigger and I2C export, built on tifffile.'
readme = 'README.md'
dynamic = ['version']
authors = [
   {name = 'Horst Obenhaus'},
]
classifiers = [
   'Development Status :: 3 - Alpha',
   'Intended Audience :: Science/Research',
   'Programming Language :: Python :: 3',
   'Programming Language :: Python :: 3.11',
   'Programming Language :: Python :: 3.12',
   'Programming Language :: Python :: 3.13',
   'Topic :: Scientific/Engineering',
   'Operating System :: OS Independent',
   'License :: OSI Approved :: MIT License',
]
# 3.11 keeps this co-installable with the `octron` environment.
requires-python = '>=3.11'
dependencies = [
   'tifffile>=2024.7.21',
   'numpy>=1.24',
   'typer>=0.12',
   'rich>=13.0',
   'matplotlib>=3.7',
   'seaborn>=0.13',
]

[project.optional-dependencies]
dev = [
   'pytest',
   'coverage',
   'ruff',
]

[project.scripts]
socto = 'scanimage_octo_reader.cli:main'
scanimage-octo-reader = 'scanimage_octo_reader.cli:main'

[project.urls]
source = 'https://github.com/horsto/scanimage-octo-reader'
tracker = 'https://github.com/horsto/scanimage-octo-reader/issues'

[tool.setuptools_scm]
write_to = 'src/scanimage_octo_reader/_version.py'
# Allows building/installing from a source tree without git metadata.
fallback_version = '0.0.0'

[tool.ruff]
line-length = 100
target-version = 'py311'
# Exploratory notebooks follow their own conventions (out-of-order cells,
# imports where they are first needed); linting them adds noise, not safety.
# `_version.py` is written by setuptools_scm at build time and is not ours to
# format.
extend-exclude = ['notebooks', 'src/scanimage_octo_reader/_version.py']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'C4', 'SIM']
ignore = [
   'B905',  # zip strict= is noisy for short, obviously-equal-length pairs
]

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['E501']

[tool.pytest.ini_options]
testpaths = ['tests']
filterwarnings = ['error::DeprecationWarning']

[tool.coverage.run]
omit = ['*/_version.py']
source = ['scanimage_octo_reader', 'tests']
